<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System</title>
</head>
<link rel="stylesheet" href="../static/style.css">
<body>
    <h1>Patient Management System</h1>

    <h2>Add New Patient</h2>

    <form id="patient-form">

        <label for="patient-id">Patient ID:</label>
        <input type="text" id="patient-id" required>

        <br><br>

        <label for="name">Patient Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label for="city">City:</label>
        <input type="text" id="city" required>

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" min="1" max="119" required>

        <br><br>

        <label for="gender">Gender:</label>

        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select>

        <br><br>

        <label for="height">Height (metres):</label>
        <input type="number" id="height" min="0.01" step="0.01" required>

        <br><br>

        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" min="0.01" step="0.1" required>

        <br><br>

        <button type="submit">Add Patient</button>

    </form>

    
</body>
</html>
